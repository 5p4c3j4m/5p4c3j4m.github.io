<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Namewell – Pick a Name</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#CFE0EE;--ink:#14213D;--soft:#4A5A78;--card:#F7FAFC;--accent:#F2B705;--on-accent:#14213D;--line:#B5C6D6;--chip:#E6EEF5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1424;--ink:#E8EEF7;--soft:#9AAAC4;--card:#16233B;--line:#2C3E5E;--chip:#1F2F4D}}
:root[data-theme="dark"]{--bg:#0B1424;--ink:#E8EEF7;--soft:#9AAAC4;--card:#16233B;--line:#2C3E5E;--chip:#1F2F4D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;line-height:1.5;
background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:22px 22px}
main{max-width:820px;margin:0 auto;padding:36px 20px 72px;display:grid;gap:22px}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,9vw,3.8rem);letter-spacing:-.04em;line-height:1;margin:0 0 4px}
h1 span{background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%)}
h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.25rem;margin:0 0 14px;letter-spacing:-.01em}
section{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:22px;box-shadow:6px 6px 0 var(--ink)}
label{display:block;font-weight:600}
.hint{color:var(--soft);margin:0 0 10px;font-size:.92rem}
#saved{margin:8px 0 0;font-size:.85rem}
textarea{width:100%;min-height:140px;resize:vertical;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
textarea:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0}
.go,.mk{font:inherit;font-weight:700;background:var(--accent);color:var(--on-accent);border:2px solid var(--ink);padding:10px 20px;border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.go{font-size:1.15rem;padding:14px 32px;box-shadow:4px 4px 0 var(--ink)}
.go:active,.mk:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.ghost{font:inherit;font-weight:600;background:transparent;color:var(--ink);border:2px solid var(--line);padding:10px 16px;border-radius:12px;cursor:pointer}
.ghost:hover:not(:disabled){border-color:var(--ink)}
.ghost:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.size{display:flex;align-items:center;gap:8px;margin:0;color:var(--soft)}
.size select{font:inherit;font-weight:600;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 10px}
[hidden]{display:none!important}
input[type=text]{flex:1 1 180px;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=text]:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font:inherit;font-weight:600;color:var(--ink);background:var(--chip);border:2px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="false"]{border-color:var(--line);color:var(--soft);text-decoration:line-through;background:transparent}
.pairs{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pairs:empty{display:none}
.pairs li{background:var(--chip);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;font-weight:600;overflow-wrap:anywhere}
.pairs li b{display:inline-block;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 10px;margin-bottom:8px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.pairs li span{color:var(--soft);font-weight:400;padding:0 5px}
.hero{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.hero p{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.6rem,11vw,5.5rem);line-height:1;margin:0;letter-spacing:-.03em}
.hero p.idle{color:var(--soft);font-size:1.1rem;font-weight:500;letter-spacing:0;font-family:"Instrument Sans",system-ui,sans-serif}
.hero p.spin{color:var(--soft)}
.hero:has(.idle:empty){min-height:0}
.err{color:var(--soft);margin:0;text-align:left}.err:empty{display:none}.err:not(:empty){margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1><span>Namewell</span></h1>
<section aria-labelledby="gt">
<h2 id="gt">Groups and teams</h2>
<div class="row">
  <button class="mk" id="pairs">Make groups</button>
  <label class="size" for="size">Size
    <select id="size"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
  </label>
  <span style="flex:1 1 20px"></span>
  <button class="mk" id="teams">Make teams</button>
  <label class="size" for="tcount">Teams
    <select id="tcount"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select>
  </label>
</div>
<p class="err" id="msg" role="status"></p>
<ul class="pairs" id="pairList" aria-label="Groups and teams"></ul>
<div class="row" id="resTools" hidden style="margin:14px 0 0">
  <button class="ghost" id="again">Shuffle again</button>
  <button class="ghost" id="copyRes">Copy results</button>
</div>
</section>
<section aria-labelledby="nt">
<h2 id="nt">Your names</h2>
<p class="hint">One per line, or separated by commas.</p>
<textarea id="names" aria-labelledby="nt" placeholder="Maple&#10;Juniper&#10;Atlas&#10;Willow"></textarea>
<p class="hint" id="saved" role="status">Your list saves as you type.</p>
<div class="row" style="margin:12px 0 0">
  <label class="size" for="listSel">Saved lists
    <select id="listSel"></select>
  </label>
  <button class="ghost" id="delList" hidden>Delete list</button>
</div>
<div class="row" style="margin:10px 0 0">
  <input type="text" id="listName" placeholder="Name this list" aria-label="List name" maxlength="40">
  <button class="mk" id="saveList">Save list</button>
</div>
<p class="hint" id="chipHint" style="display:none;margin-top:14px">Select a name to turn it off or on. Names that are off are skipped.</p>
<div class="chips" id="chips"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let busy=false,current="",doc=null,timer=null,off=new Set(),lists={},listsDoc=null,lastResult=[],lastKind="";
try{lists=JSON.parse(localStorage.getItem("namewell-lists")||"{}")}catch(e){lists={}}
function persistLists(){
  try{localStorage.setItem("namewell-lists",JSON.stringify(lists))}catch(e){}
  if(listsDoc)listsDoc.set({json:JSON.stringify(lists)}).catch(()=>{});
}
function renderLists(sel){
  const el=$("listSel"),names=Object.keys(lists);
  el.innerHTML="";
  el.appendChild(new Option(names.length?"Choose a list":"None saved yet",""));
  names.forEach(n=>el.appendChild(new Option(n,n)));
  el.value=sel&&lists[sel]?sel:"";
  $("delList").hidden=!el.value;
}
function showResults(groups,prefix){
  lastKind=prefix;
  lastResult=groups.map((g,i)=>prefix+" "+(i+1)+": "+g.join(", "));
  const ul=$("pairList");ul.innerHTML="";
  groups.forEach((g,i)=>{const li=document.createElement("li"),h=document.createElement("b");h.textContent=prefix+" "+(i+1);li.appendChild(h);li.appendChild(document.createElement("br"));li.appendChild(document.createTextNode(g.join(", ")));ul.appendChild(li)});
  $("resTools").hidden=false;
}
function save(){
  try{localStorage.setItem("namewell-list",$("names").value);localStorage.setItem("namewell-off",JSON.stringify([...off]))}catch(e){}
  $("saved").textContent="Saving…";
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    if(!doc){$("saved").textContent="Saved in this browser";return}
    try{await doc.set({text:$("names").value,off:[...off]});timer=null;$("saved").textContent="Saved to your account"}
    catch(e){$("saved").textContent="Saved in this browser"}
  },500);
}
function flush(){
  try{localStorage.setItem("namewell-list",$("names").value);localStorage.setItem("namewell-off",JSON.stringify([...off]))}catch(e){}
  if(timer){clearTimeout(timer);timer=null;if(doc)doc.set({text:$("names").value,off:[...off]}).catch(()=>{})}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
addEventListener("pagehide",flush);
addEventListener("beforeunload",flush);
(async()=>{
  try{
    if(!window.claude)return;
    const db=await claude.use("db"),user=await claude.use("user");
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    doc=db.doc("data/users/"+id+"/names");
    listsDoc=db.doc("data/users/"+id+"/lists");
    try{const ls=await listsDoc.get();if(ls.exists&&typeof ls.data().json==="string"){lists=Object.assign({},JSON.parse(ls.data().json),lists);renderLists()}else if(Object.keys(lists).length)persistLists()}catch(e){}
    const snap=await doc.get();
    if(snap.exists&&typeof snap.data().text==="string"){$("names").value=snap.data().text;off=new Set(Array.isArray(snap.data().off)?snap.data().off:[]);renderChips();$("saved").textContent="Saved to your account"}
    else if($("names").value.trim())save();
  }catch(e){doc=null}
})();
try{const s=localStorage.getItem("namewell-list");if(s)$("names").value=s;off=new Set(JSON.parse(localStorage.getItem("namewell-off")||"[]"))}catch(e){}
$("names").addEventListener("input",()=>{renderChips();save()});
function parseAll(){return [...new Set($("names").value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean))]}
function parse(){return parseAll().filter(n=>!off.has(n))}
function active(){return parse()}
function renderChips(){
  const all=parseAll();off=new Set([...off].filter(n=>all.includes(n)));
  const box=$("chips");box.innerHTML="";
  $("chipHint").style.display=all.length?"block":"none";
  all.forEach(n=>{const b=document.createElement("button");b.type="button";b.className="chip";b.textContent=n;b.setAttribute("aria-pressed",!off.has(n));
    b.onclick=()=>{off.has(n)?off.delete(n):off.add(n);renderChips();save()};box.appendChild(b)});
}
$("pairs").onclick=()=>{
  if(busy)return;
  const list=active();
  if(list.length<2){$("msg").textContent="You need at least two turned-on names to make groups.";return}
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  const k=+$("size").value,n=list.length;
  const g=Math.max(1,Math.min(Math.round(n/k),Math.floor(n/2)));
  const base=Math.floor(n/g),extra=n%g,groups=[];
  let at=0;
  for(let i=0;i<g;i++){const sz=base+(i<extra?1:0);groups.push(list.slice(at,at+sz));at+=sz}
  showResults(groups,"Group");
  const sizes=[...new Set(groups.map(x=>x.length))];
  $("msg").textContent=sizes.length>1?"Names don't split evenly, so group sizes vary slightly.":"";
};
$("teams").onclick=()=>{
  if(busy)return;
  const list=active(),t=+$("tcount").value;
  if(list.length<t){$("msg").textContent="You need at least "+t+" turned-on names to make "+t+" teams.";return}
  for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  const teams=Array.from({length:t},()=>[]);
  list.forEach((n,i)=>teams[i%t].push(n));
  showResults(teams,"Team");
  const sizes=[...new Set(teams.map(x=>x.length))];
  $("msg").textContent=sizes.length>1?"Names don't split evenly, so team sizes vary slightly.":"";
};
renderChips();renderLists();
$("saveList").onclick=()=>{
  const n=$("listName").value.trim();
  if(!n){$("saved").textContent="Type a name for the list first.";return}
  lists[n]={text:$("names").value,off:[...off]};persistLists();renderLists(n);$("listName").value="";
  $("saved").textContent="Saved the list “"+n+"”.";
};
$("listSel").onchange=()=>{
  const n=$("listSel").value;$("delList").hidden=!n;
  if(!n)return;
  const l=lists[n];$("names").value=l.text||"";off=new Set(Array.isArray(l.off)?l.off:[]);
  renderChips();save();
};
$("delList").onclick=()=>{const n=$("listSel").value;if(!n)return;delete lists[n];persistLists();renderLists();$("saved").textContent="Deleted “"+n+"”."};
$("again").onclick=()=>$(lastKind==="Team"?"teams":"pairs").click();
$("copyRes").onclick=async()=>{try{await navigator.clipboard.writeText(lastResult.join("\n"));$("msg").textContent="Copied the results."}catch(e){$("msg").textContent="Copy isn't available here."}};
</script>
</body>
</html>
